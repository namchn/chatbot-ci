# main에 Commit이 들어오면: test → build-and-push → update-config
# update-config는 새 이미지 Tag로 chatbot-config의 green.yaml을 고친 PR을 엽니다
# Merge는 사람이 합니다. 41일차 ci.yml에 Job 하나를 더한 것이고, 고칠 곳은 없습니다
# 필요한 것: chatbot-ci의 Actions secret CONFIG_TOKEN (chatbot-config 하나만 고칠 수 있는 Token)
name: chatbot-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # 만든 이미지의 Tag (sha-와 일곱 글자)를 다음 Job에 넘깁니다
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-config:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
      CONFIG: ${{ github.repository_owner }}/chatbot-config
    steps:
      # Secret이 없으면 여기서 멈추고 이유를 적습니다 (값은 로그에 *** 로 가려짐)
      - name: Secret 확인
        env:
          CONFIG_TOKEN: ${{ secrets.CONFIG_TOKEN }}
        run: |
          if [ -z "$CONFIG_TOKEN" ]; then
            echo "::error::Secret CONFIG_TOKEN이 없습니다. chatbot-ci의 Settings > Secrets and variables > Actions에서 이름을 봅니다"
            exit 1
          fi
      # chatbot-ci (model.json을 읽어 PR 제목에 씀)
      - uses: actions/checkout@v7
        with:
          path: chatbot-ci
      # 내 chatbot-config를 Token으로 받음 (이 Token으로 브랜치를 올리고 PR을 엶)
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CONFIG }}
          token: ${{ secrets.CONFIG_TOKEN }}
          path: chatbot-config
      - name: green.yaml의 Tag를 바꾸고 PR 열기
        working-directory: chatbot-config
        env:
          GH_TOKEN: ${{ secrets.CONFIG_TOKEN }}
        run: |
          case "$TAG" in
            sha-*) ;;
            *) echo "::error::build-and-push가 Tag를 넘기지 않았습니다: $TAG"; exit 1 ;;
          esac
          if [ ! -f green.yaml ]; then
            echo "::error::$CONFIG에 green.yaml이 없습니다 (43일차 Green 파일)"
            exit 1
          fi
          if ! grep -q 'image: ghcr\.io/.*/chatbot-ci:' green.yaml; then
            echo "::error::green.yaml에 chatbot-ci 이미지 줄이 없습니다"
            exit 1
          fi
          MAX=$(python3 -c 'import json; print(json.load(open("../chatbot-ci/model.json"))["max_answer"])')
          # image 줄의 Tag (: 뒤)만 새 Tag로 바꿉니다
          sed -i -E "s#(image: ghcr\.io/[^ ]+/chatbot-ci:)[^ ]+#\1$TAG#" green.yaml
          if git diff --quiet; then
            echo "green.yaml이 이미 ${TAG}입니다. 바꿀 것이 없어 PR을 만들지 않고 끝냅니다"
            exit 0
          fi
          git diff
          BRANCH="update-green-$TAG"
          OPEN=$(gh pr list --repo "$CONFIG" --head "$BRANCH" --state open --json number --jq length) || {
            echo "::error::PR 목록을 읽지 못했습니다. Token의 저장소 (chatbot-config)와 Pull requests 권한을 봅니다"
            exit 1
          }
          if [ "$OPEN" != 0 ]; then
            echo "이미 열린 PR이 있습니다 (브랜치 $BRANCH). 새로 만들지 않고 끝냅니다"
            exit 0
          fi
          # 같은 Tag의 브랜치가 남아 있으면 (앞에서 PR만 못 만든 경우) 그 브랜치로 PR을 엶
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "같은 이름의 브랜치가 이미 있어 그 브랜치로 PR을 엽니다 ($BRANCH)"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$BRANCH"
            git commit -am "Update green.yaml image to $TAG"
            git push origin "$BRANCH" || {
              echo "::error::브랜치를 올리지 못했습니다. Token의 저장소 (chatbot-config)와 Contents 권한 (Read and write)을 봅니다"
              exit 1
            }
          fi
          IMAGE=$(grep -o 'ghcr\.io/[^ ]*chatbot-ci:[^ ]*' green.yaml)
          gh pr create --repo "$CONFIG" --base main --head "$BRANCH" \
            --title "Update chatbot-green image to $TAG (max_answer $MAX)" \
            --body "chatbot-ci의 Commit ${GITHUB_SHA::7}에서 Actions가 만든 이미지입니다.
          이미지: $IMAGE
          model.json의 max_answer: $MAX
          Files changed에서 image 줄 하나가 바뀌었는지 읽고 Merge합니다." || {
            echo "::error::PR을 만들지 못했습니다. Token의 Pull requests 권한 (Read and write)을 봅니다"
            exit 1
          }
